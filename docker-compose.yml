services:
  backend:
    build: ./backend
    environment:
      APP_DATA_DIR: /app/data
      ACP_ENABLED: "${ACP_ENABLED:-true}"
      ACP_AGENT_COMMAND: "${ACP_AGENT_COMMAND:-npx}"
      ACP_AGENT_ARGS: "${ACP_AGENT_ARGS:--y,@agentclientprotocol/codex-acp}"
      ACP_WORKSPACE: /workspace
      ACP_TIMEOUT: "${ACP_TIMEOUT:-180s}"
      ACP_MODELS: "${ACP_MODELS:-gpt-5.6-terra[high],gpt-5.6-sol[xhigh]}"
      ACP_DEFAULT_MODEL: "${ACP_DEFAULT_MODEL:-gpt-5.6-terra[high]}"
      APP_ADMIN_USERNAME: "${APP_ADMIN_USERNAME:-}"
      APP_ADMIN_PASSWORD: "${APP_ADMIN_PASSWORD:-}"
      APP_ADMIN_EMAIL: "${APP_ADMIN_EMAIL:-}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      CODEX_API_KEY: "${CODEX_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      NO_BROWSER: "1"
      INITIAL_AGENT_MODE: "read-only"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    volumes:
      - trainer-data:/app/data
      - ./:/workspace
    expose:
      - "8080"

  frontend:
    build: ./frontend
    ports:
      - "8088:80"
    depends_on:
      - backend

volumes:
  trainer-data:
