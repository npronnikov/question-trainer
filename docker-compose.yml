services:
  backend:
    build: ./backend
    environment:
      APP_DATA_DIR: /app/data
      ACP_ENABLED: "${ACP_ENABLED:-true}"
      ACP_AGENT_COMMAND: "${ACP_AGENT_COMMAND:-npx}"
      ACP_AGENT_ARGS: "${ACP_AGENT_ARGS:--y,@agentclientprotocol/codex-acp}"
      ACP_WORKSPACE: /workspace
      ACP_TIMEOUT: "${ACP_TIMEOUT:-180s}"
      CODEX_API_KEY: "${CODEX_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      NO_BROWSER: "1"
      INITIAL_AGENT_MODE: "read-only"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    volumes:
      - trainer-data:/app/data
      - ./:/workspace
    expose:
      - "8080"

  frontend:
    build: ./frontend
    ports:
      - "8088:80"
    depends_on:
      - backend

volumes:
  trainer-data:
