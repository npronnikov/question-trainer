server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
      timeout: 30d

spring:
  application:
    name: question-hacker-backend
  datasource:
    url: jdbc:h2:file:${APP_DATA_DIR:./data}/question-hacker;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: false
  jackson:
    default-property-inclusion: non_null

app:
  acp:
    enabled: ${ACP_ENABLED:true}
    fallback-enabled: ${ACP_FALLBACK_ENABLED:true}
    command: ${ACP_AGENT_COMMAND:npx}
    args: ${ACP_AGENT_ARGS:-y,@agentclientprotocol/codex-acp}
    workspace: ${ACP_WORKSPACE:./workspace}
    timeout: ${ACP_TIMEOUT:180s}
    max-file-bytes: 524288
    forward-env: CODEX_API_KEY,OPENAI_API_KEY,ANTHROPIC_API_KEY,GEMINI_API_KEY,CODEX_PATH,CODEX_CONFIG,MODEL_PROVIDER
    models: ${ACP_MODELS:gpt-5.6-terra[high],gpt-5.6-sol[xhigh]}
    default-model: ${ACP_DEFAULT_MODEL:gpt-5.6-terra[high]}
  chat:
    max-message-chars: 12000
    history-limit: 24
  admin:
    username: ${APP_ADMIN_USERNAME:}
    password: ${APP_ADMIN_PASSWORD:}
    email: ${APP_ADMIN_EMAIL:}

logging:
  level:
    ru.questionhacker.trainer: INFO
    com.agentclientprotocol: WARN
